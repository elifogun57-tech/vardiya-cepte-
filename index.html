
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b55">
<title>Vardiya Cepte</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f6f4;color:#18332b;margin:0;padding:18px}
main{max-width:650px;margin:auto}
header,.card{background:white;border-radius:14px;padding:18px;margin-bottom:14px}
header{background:#176b55;color:white}
h1{margin:0 0 6px}
label{display:block;margin:12px 0 5px}
input,select,button{font:inherit;padding:12px;border:1px solid #ccd9d2;border-radius:9px;width:100%}
button{background:#176b55;color:white;border:0;margin-top:12px;font-weight:bold}
#days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.day{background:#eef5f1;padding:9px 2px;text-align:center;border-radius:8px;font-size:12px;min-height:48px;cursor:pointer}
.day b{display:block;margin-bottom:5px}
.Gündüz{background:#c9efd9}
.Gece{background:#dcdcff}
.Boş{background:#e9eceb}
.İzin{background:#ffe0e4}
.nav{display:flex;gap:8px}
.nav button{width:50%}
#status{font-size:12px;color:#176b55;margin-top:10px}
</style>
</head>
<body>
<main>
<header>
<h1>Vardiya Cepte</h1>
<div>Vardiyanı kolayca takip et</div>
</header>
<section class="card">
<h3>Vardiya ayarları</h3>
<label>Başlangıç tarihi</label>
<input id="start" type="date">
<label>Vardiya düzeni</label>
<select id="cycle">
<option value="2-2">2 gündüz / 2 gece / 2 boş</option>
<option value="1-1-1">1 gündüz / 1 gece / 1 boş</option>
</select>
<button onclick="draw()">Takvimi oluştur</button>
<div id="status">Bilgilerin otomatik kaydedilir.</div>
</section>
<section class="card">
<div class="nav">
<button onclick="changeMonth(-1)">◀ Önceki ay</button>
<button onclick="changeMonth(1)">Sonraki ay ▶</button>
</div>
<h3 id="month"></h3>
<div id="days"></div>
</section>
<section class="card">
<b>Kullanım bilgisi</b>
<p>Bir güne dokunarak Gündüz, Gece, Boş veya İzin olarak değiştirebilirsin. Değişiklikler telefonuna kaydedilir.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function localDate(d){
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
let saved={};
try{saved=JSON.parse(localStorage.getItem('vardiyaCepte')||'{}')}catch(e){}
$('start').value=saved.start||localDate(new Date());
$('cycle').value=saved.cycle||'2-2';
let edits=saved.edits||{};
let shown=new Date();
shown.setDate(1);
function save(){
localStorage.setItem('vardiyaCepte',JSON.stringify({start:$('start').value,cycle:$('cycle').value,edits}));
$('status').textContent='✓ Bilgilerin kaydedildi.';
}
function changeMonth(n){shown.setMonth(shown.getMonth()+n);draw()}
function draw(){
const first=new Date(shown.getFullYear(),shown.getMonth(),1);
const total=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();
$('month').textContent=shown.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
$('days').innerHTML=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(n=>'<div class="day"><b>'+n+'</b></div>').join('');
const start=new Date($('start').value+'T12:00:00');
const seq=$('cycle').value==='2-2'?['Gündüz','Gündüz','Gece','Gece','Boş','Boş']:['Gündüz','Gece','Boş'];
for(let i=0;i<(first.getDay()+6)%7;i++)$('days').innerHTML+='<div></div>';
for(let n=1;n<=total;n++){
const d=new Date(shown.getFullYear(),shown.getMonth(),n,12);
const delta=Math.round((d-start)/86400000);
const key=localDate(d);
const v=edits[key]||seq[((delta%seq.length)+seq.length)%seq.length];
const el=document.createElement('div');
el.className='day '+v;
el.innerHTML='<b>'+n+'</b>'+v;
el.onclick=()=>{
const a=['Gündüz','Gece','Boş','İzin'];
edits[key]=a[(a.indexOf(v)+1)%a.length];
save();draw();
};
$('days').appendChild(el);
}
}
$('start').addEventListener('change',()=>{save();draw()});
$('cycle').addEventListener('change',()=>{save();draw()});
draw();
</script>
</body>
</html>
