<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vardiya Cepte</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f6f4;color:#18332b;margin:0;padding:18px}
main{max-width:650px;margin:auto}header,.card{background:white;border-radius:14px;padding:18px;margin-bottom:14px}
header{background:#176b55;color:white}h1{margin:0 0 6px}label{display:block;margin:12px 0 5px;color:#53665f}
input,select,button{font:inherit;padding:11px;border:1px solid #ccd9d2;border-radius:9px;width:100%;box-sizing:border-box}
button{background:#176b55;color:white;border:0;margin-top:12px;font-weight:bold}
#days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.day{background:#eef5f1;padding:9px 2px;text-align:center;border-radius:8px;font-size:12px;min-height:44px}
.day b{display:block;margin-bottom:5px}.Gündüz{background:#c9efd9}.Gece{background:#dcdcff}.Boş{background:#e9eceb}.İzin{background:#ffe0e4}
</style></head><body><main>
<header><h1>Vardiya Cepte</h1><div>Vardiyanı kolayca takip et</div></header>
<section class="card"><h3>Vardiya ayarları</h3>
<label>Başlangıç tarihi</label><input id="start" type="date">
<label>Vardiya düzeni</label><select id="cycle"><option value="2-2">2 gündüz / 2 gece / 2 boş</option><option value="1-1-1">1 gündüz / 1 gece / 1 boş</option></select>
<button onclick="draw()">Takvimi oluştur</button></section>
<section class="card"><h3 id="month"></h3><div id="days"></div></section>
<section class="card"><b>Bilgi:</b> Bir güne dokunarak o günü Gündüz, Gece, Boş veya İzin olarak değiştirebilirsin. Ayarların bu telefonda saklanır.</section>
</main><script>
const $=x=>document.getElementById(x);
$('start').value=new Date().toISOString().slice(0,10);
let shown=new Date();shown.setDate(1);let edits={};
function draw(){
 const first=new Date(shown.getFullYear(),shown.getMonth(),1), total=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();
 $('month').textContent=shown.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
 const names=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];$('days').innerHTML=names.map(n=>'<div class="day"><b>'+n+'</b></div>').join('');
 let start=new Date($('start').value+'T12:00:00'), seq=$('cycle').value==='2-2'?['Gündüz','Gündüz','Gece','Gece','Boş','Boş']:['Gündüz','Gece','Boş'];
 for(let i=0;i<(first.getDay()+6)%7;i++)$('days').innerHTML+='<div></div>';
 for(let n=1;n<=total;n++){let d=new Date(shown.getFullYear(),shown.getMonth(),n,12),delta=Math.floor((d-start)/86400000),k=d.toISOString().slice(0,10),v=edits[k]||seq[((delta%seq.length)+seq.length)%seq.length]||'Boş';let el=document.createElement('div');el.className='day '+v;el.innerHTML='<b>'+n+'</b>'+v;el.onclick=()=>{let a=['Gündüz','Gece','Boş','İzin'];edits[k]=a[(a.indexOf(v)+1)%a.length];draw()};$('days').appendChild(el)}
}
draw();
</script></body></html>
